{% extends 'base.html' %}

{% block title %}Register - EduRate{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        <div class="bg-dark-card border border-dark rounded-2xl p-8">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-4">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                    </svg>
                </div>
                <h2 class="text-3xl font-bold">Create Account</h2>
                <p class="text-gray-custom mt-2">Join EduRate today</p>
            </div>

            <form method="POST" class="space-y-6">
                {% csrf_token %}

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="first_name" class="block text-sm font-medium mb-2">First Name</label>
                        <input type="text"
                               name="first_name"
                               id="first_name"
                               required
                               class="w-full px-4 py-3 bg-dark border border-dark rounded-lg focus:outline-none focus:border-blue-600 transition"
                               placeholder="John">
                    </div>
                    <div>
                        <label for="last_name" class="block text-sm font-medium mb-2">Last Name</label>
                        <input type="text"
                               name="last_name"
                               id="last_name"
                               required
                               class="w-full px-4 py-3 bg-dark border border-dark rounded-lg focus:outline-none focus:border-blue-600 transition"
                               placeholder="Doe">
                    </div>
                </div>

                <div>
                    <label for="username" class="block text-sm font-medium mb-2">Username</label>
                    <input type="text"
                           name="username"
                           id="username"
                           required
                           class="w-full px-4 py-3 bg-dark border border-dark rounded-lg focus:outline-none focus:border-blue-600 transition"
                           placeholder="johndoe">
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium mb-2">Email</label>
                    <input type="email"
                           name="email"
                           id="email"
                           required
                           class="w-full px-4 py-3 bg-dark border border-dark rounded-lg focus:outline-none focus:border-blue-600 transition"
                           placeholder="john@example.com">
                </div>

                <div>
                    <label for="user_type" class="block text-sm font-medium mb-2">I am a...</label>
                    <select name="user_type"
                            id="user_type"
                            required
                            class="w-full px-4 py-3 bg-dark border border-dark rounded-lg focus:outline-none focus:border-blue-600 transition">
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                    </select>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium mb-2">Password</label>
                    <input type="password"
                           name="password"
                           id="password"
                           required
                           class="w-full px-4 py-3 bg-dark border border-dark rounded-lg focus:outline-none focus:border-blue-600 transition"
                           placeholder="••••••••">
                </div>

                <div>
                    <label for="password2" class="block text-sm font-medium mb-2">Confirm Password</label>
                    <input type="password"
                           name="password2"
                           id="password2"
                           required
                           class="w-full px-4 py-3 bg-dark border border-dark rounded-lg focus:outline-none focus:border-blue-600 transition"
                           placeholder="••••••••">
                </div>

                <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
                    Create Account
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-gray-custom">
                    Already have an account?
                    <a href="{% url 'login' %}" class="text-blue-500 hover:text-blue-400 font-medium">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
