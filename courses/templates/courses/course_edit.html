{% extends 'base.html' %}

{% block page_title %}Edit Course{% endblock %}

{% block authenticated_content %}
<div class="max-w-4xl mx-auto">
    <div class="bg-dark-card border border-dark rounded-xl p-8">
        <div class="mb-8">
            <h2 class="text-3xl font-bold mb-2">Edit Course</h2>
            <p class="text-gray-custom">Update course details and manage enrollments</p>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label for="title" class="block text-sm font-medium mb-2">Course Title *</label>
                    <input type="text" name="title" id="title" required value="{{ course.title }}"
                           class="w-full px-4 py-3 bg-dark border border-dark rounded-lg focus:outline-none focus:border-blue-600 transition">
                </div>

                <div>
                    <label for="code" class="block text-sm font-medium mb-2">Course Code *</label>
                    <input type="text" name="code" id="code" required value="{{ course.code }}"
                           class="w-full px-4 py-3 bg-dark border border-dark rounded-lg focus:outline-none focus:border-blue-600 transition">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label for="icon" class="block text-sm font-medium mb-2">Course Icon</label>
                    <input type="text" name="icon" id="icon" maxlength="2" value="{{ course.icon }}"
                           class="w-full px-4 py-3 bg-dark border border-dark rounded-lg focus:outline-none focus:border-blue-600 transition">
                </div>

                <div>
                    <label for="status" class="block text-sm font-medium mb-2">Status *</label>
                    <select name="status" id="status" required
                            class="w-full px-4 py-3 bg-dark border border-dark rounded-lg focus:outline-none focus:border-blue-600 transition">
                        {% for value, label in course.STATUS_CHOICES %}
                        <option value="{{ value }}" {% if course.status== value %}selected{% endif %}>{{ label }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div>
                <label for="teacher" class="block text-sm font-medium mb-2">Assign Teacher *</label>
                <select name="teacher" id="teacher" required
                        class="w-full px-4 py-3 bg-dark border border-dark rounded-lg focus:outline-none focus:border-blue-600 transition">
                    {% for teacher in teachers %}
                    <option value="{{ teacher.id }}" {% if course.teacher.id== teacher.id %}selected{% endif %}>
                        {{ teacher.get_full_name|default:teacher.username }} ({{ teacher.email }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="description" class="block text-sm font-medium mb-2">Description *</label>
                <textarea name="description" id="description" rows="5" required
                          class="w-full px-4 py-3 bg-dark border border-dark rounded-lg focus:outline-none focus:border-blue-600 transition resize-none">{{ course.description }}</textarea>
            </div>

            <div>
                <label class="block text-sm font-medium mb-3">Enrolled Students</label>
                <div class="bg-dark border border-dark rounded-lg p-4 max-h-64 overflow-y-auto">
                    {% for student in students %}
                    <label class="flex items-center gap-3 py-2 hover:bg-dark-hover rounded px-2 cursor-pointer">
                        <input type="checkbox" name="students" value="{{ student.id }}"
                               {% if student.id in enrolled_students %}checked{% endif %}
                               class="w-4 h-4 text-blue-600 bg-dark border-gray-600 rounded focus:ring-blue-500">
                        <div class="flex items-center gap-2 flex-1">
                            <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-xs font-bold">
                                {{ student.first_name.0|default:student.username.0|upper }}{{ student.last_name.0|upper
                                }}
                            </div>
                            <div>
                                <p class="text-sm font-medium">{{ student.get_full_name|default:student.username }}</p>
                                <p class="text-xs text-gray-custom">{{ student.email }}</p>
                            </div>
                        </div>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <div class="flex gap-4">
                <button type="submit"
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
                    Update Course
                </button>
                <a href="{% url 'course_detail' course.id %}"
                   class="flex-1 bg-dark border border-dark hover:bg-dark-hover text-white font-semibold py-3 rounded-lg transition text-center">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
